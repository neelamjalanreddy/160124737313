<!DOCTYPE html>
<html>
  <head>
    <title>Exp1 - Time Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>

    <!-- Bootstrap Container -->
    <div class="container mt-4">

      <!-- Bootstrap Grid -->
      <div class="row">
        <div class="col text-center">
          <h1>Time Table</h1>
        </div>
      </div>

      <div class="row">
        <div class="col">

          <!-- Bootstrap Table -->
          <table class="table table-bordered table-striped text-center">

            <thead class="table-dark">
              <tr>
                <th>Day/Time</th>
                <th>9:10-10:10</th>
                <th>10:10-11:10</th>
                <th>11:15-12:15</th>
                <th>12:15-1:00</th>
                <th>1:00-2:00</th>
                <th>2:00-3:00</th>
                <th>3:05-4:05</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <th>Monday</th>
                <td>EEA</td>
                <td>PQT</td>
                <td>Math</td>
                <td class="table-warning">Lunch</td>
                <td>DBMS</td>
                <td>Library</td>
                <td>Sports</td>
              </tr>

              <tr>
                <th>Tuesday</th>
                <td>minip</td>
                <td>minip</td>
                <td>Library</td>
                <td class="table-warning">Lunch</td>
                <td>PQT</td>
                <td>EEA</td>
                <td>ES</td>
              </tr>
            </tbody>

          </table>

        </div>
      </div>

    </div>

  </body>
</html>
