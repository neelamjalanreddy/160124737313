<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center text-success mb-4">Student Registration Form</h3>

        <form onsubmit="showMsg(event)">
            <div class="row mb-3">
                <div class="col">
                    <input type="text" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="Roll Number" required>
                </div>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label><br>
                <input type="radio" name="g"> Male
                <input type="radio" name="g" class="ms-3"> Female
            </div>

            <div class="mb-3">
                <select class="form-select">
                    <option selected>Choose Department</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>MECH</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Subjects</label><br>
                <input type="checkbox"> DBMS
                <input type="checkbox" class="ms-2"> OS
                <input type="checkbox" class="ms-2"> CN
            </div>

            <div class="mb-3">
                <input type="file" class="form-control">
            </div>

            <div class="text-center">
                <button class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-danger ms-2">Reset</button>
            </div>
        </form>

        <div id="msg" class="alert alert-success mt-3 d-none">
            Form submitted successfully
        </div>
    </div>
</div>

<script>
function showMsg(e){
    e.preventDefault();
    document.getElementById("msg").classList.remove("d-none");
}
</script>

</body>
</html>
